<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil - Beanesia</title>
  <link rel="shortcut icon" href="/src/assets/Include/Picture/WebLogo.svg" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  <style>
    html { scrollbar-width: none; }
    .gold { color: #C4A46C; }
    .card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; }
  </style>
</head>

<body class="bg-[#141414] min-h-screen text-white">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center bg-[#050505] px-[50px] h-[90px] border-b border-[#1a1a1a]">
    <a href="/src/pages/Home.html">
      <img src="/src/assets/Include/NavIcon/MainLogo.svg" alt="Beanesia Logo" class="h-15 object-contain" />
    </a>
    <div class="flex items-center gap-9">
      <ul class="flex gap-10">
        <li><a href="/src/pages/Home.html" class="font-bold hover:text-[#D4AF37] transition-colors duration-200">Beranda</a></li>
        <li><a href="/src/pages/Home.html#products" class="font-bold hover:text-[#D4AF37] transition-colors duration-200">Produk</a></li>
        <li><a href="/src/pages/Home.html#Footer" class="font-bold hover:text-[#D4AF37] transition-colors duration-200">Kontak</a></li>
      </ul>
      <div class="w-px h-9 bg-white/40"></div>
      <div class="flex items-center gap-6">
        <a href="/src/pages/Keranjang.html" class="group">
          <iconify-icon icon="mdi:cart-outline" width="25" height="25" class="text-white mt-2 block group-hover:scale-110 transition-transform"></iconify-icon>
        </a>
        <a href="/src/pages/Profile.html" class="flex items-center gap-3 font-medium">
          <span id="nama-pengguna"></span>
          <img id="foto-navbar" src="https://api.dicebear.com/9.x/adventurer/svg?seed=default" alt="Foto Profil" class="size-9 rounded-full object-cover bg-white ring-2 ring-[#C4A46C]/40" />
        </a>
      </div>
    </div>
  </nav>

  <div class="pt-[90px] min-h-screen flex">

    <!-- sisi samping -->
    <aside class="hidden lg:flex flex-col w-60 min-h-[calc(100vh-90px)] bg-[#0d0d0d] border-r border-white/5 p-6 sticky top-[90px] self-start">
      <div class="flex flex-col items-center text-center mb-8">
        <img id="foto-side" src="https://api.dicebear.com/9.x/adventurer/svg?seed=default" alt="Foto" class="w-20 h-20 rounded-full object-cover ring-2 ring-[#C4A46C]/40 mb-3" />
        <p id="nama-side" class="font-semibold text-sm">—</p>
        <p id="username-side" class="text-xs mt-0.5 gold">—</p>
      </div>
      <nav class="flex-1">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#C4A46C]/10 text-[#C4A46C] text-sm">
          <i class="ti ti-user"></i> Profil Saya
        </a>
      </nav>
      <button onclick="logout()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-red-400 hover:bg-red-500/10 transition text-sm w-full">
        <i class="ti ti-logout"></i> Keluar
      </button>
    </aside>

    <!-- detail profil -->
    <main class="flex-1 p-5 lg:p-10">
      <div class="max-w-2xl flex flex-col gap-4">

        <div>
          <h1 class="text-xl font-semibold">Profil Saya</h1>
          <p class="text-gray-500 text-sm mt-1">Lihat dan kelola informasi akun kamu</p>
        </div>

        
        <div class="card overflow-hidden">
          <div class="h-24 bg-gradient-to-r from-[#1a0e05] via-[#2e1a08] to-[#3d2610]"></div>
          <div class="px-6 pb-5 -mt-10 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
            <div class="flex items-end gap-4">
              <img id="foto-profil" src="https://api.dicebear.com/9.x/adventurer/svg?seed=default" alt="Foto" class="w-20 h-20 rounded-full object-cover ring-2 ring-[#C4A46C]/50 bg-[#2a2a2a]" />
              <div class="pb-1">
                <h2 id="nama-user" class="text-lg font-semibold">—</h2>
                <p id="username-user" class="text-sm gold">—</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-500 pb-2">
              Bergabung sejak <span id="tgl-bergabung" class="text-gray-300 ml-1">—</span>
            </div>
          </div>
        </div>

        <!-- total pemesanan -->
        <div class="card p-5 flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center">
            <iconify-icon icon="mdi:shopping-outline" width="24" height="24" class="gold"></iconify-icon>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-0.5">Total Pesanan</p>
            <p id="total-pesanan" class="text-2xl font-semibold"></p>
          </div>
        </div>

        <div class="card">
          <div class="px-5 py-4 border-b border-white/5 flex items-center gap-2 text-sm font-semibold">
            <i class="ti ti-id-badge gold"></i> Informasi Akun
          </div>
          <div class="divide-y divide-white/5">

            <div class="flex items-center gap-4 px-5 py-3.5">
              <div class="w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center">
                <iconify-icon icon="mdi:email-outline" width="18" class="gold"></iconify-icon>
              </div>
              <div>
                <p class="text-xs text-gray-500">Email</p>
                <p id="email-user" class="text-sm mt-0.5">—</p>
              </div>
            </div>

            <div class="flex items-center gap-4 px-5 py-3.5">
              <div class="w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center">
                <iconify-icon icon="mdi:phone-outline" width="18" class="gold"></iconify-icon>
              </div>
              <div>
                <p class="text-xs text-gray-500">No. Telepon</p>
                <p id="phone-user" class="text-sm mt-0.5">—</p>
              </div>
            </div>

            <div class="flex items-center gap-4 px-5 py-3.5">
              <div class="w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center">
                <iconify-icon icon="mdi:map-marker-outline" width="18" class="gold"></iconify-icon>
              </div>
              <div>
                <p class="text-xs text-gray-500">Kota</p>
                <p id="kota-user" class="text-sm mt-0.5">—</p>
              </div>
            </div>
          </div>
        </div>
        <button onclick="logout()" class="lg:hidden w-full flex items-center justify-center gap-2 py-3 rounded-xl border border-red-800/30 text-red-400 hover:bg-red-500/10 transition text-sm">
           Logout
        </button>

      </div>
    </main>
  </div>
  <script src="/src/dist/Main/profile.js"></script>
</body>
</html>
