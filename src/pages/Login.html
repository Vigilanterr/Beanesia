<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Login - Beanesia</title>
</head>
<body class="bg-[#362214] min-h-screen flex">

    <div class="flex flex-col justify-center w-full max-w-xl px-12 lg:px-20">
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">
                Selamat datang kembali
            </h1>
            <p class="text-xl text-gray-300 font-serif">
                Silahkan login untuk membeli
            </p>
        </div>

        <form class="space-y-5" onsubmit="return false;">
            <div>
                <label class="block text-sm font-semibold text-white mb-2">
                    Email
                </label>
                <input
                    type="email"
                    placeholder="Example@gmail.com"
                    class="w-full px-4 py-3 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#C4A46C]"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold text-white mb-2">
                    Password
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="passwordInput"
                        class="w-full px-4 py-3 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#C4A46C]"
                    >
                    <button
                        type="button"
                        onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div class="text-right">
                <a href="#" class="text-sm font-semibold text-white hover:underline">
                    Forgot your password?
                </a>
            </div>

            <button
                type="submit"
                class="w-full bg-[#C4A46C] text-white font-bold py-3 rounded-md hover:bg-[#b3935b] transition-all"
            >
                LOGIN
            </button>
        </form>

        <div class="relative my-10">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-400"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-[#362214] px-4 text-white font-semibold text-center leading-tight">
                    Or <br> with
                </span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button class="flex items-center justify-center py-2.5 bg-white rounded-md hover:bg-gray-100 transition-colors">
                <img src="" alt="" class="h-6 w-6">
            </button>
            <button class="flex items-center justify-center py-2.5 bg-white rounded-md hover:bg-gray-100 transition-colors">
                <img src="" alt="" class="h-6 w-6">
            </button>
        </div>

        <p class="mt-10 text-center text-white">
            Tidak Punya Akun? 
            <a href="#" class="font-bold hover:underline">Register</a>
        </p>
    </div>

    <div class="hidden lg:block flex-1 relative">
        <img
            src="/src/assets/Include/Picture/LoginBanner.svg"
            alt=""
            class="absolute inset-0 w-full h-full object-cover"
        >
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
