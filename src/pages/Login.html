<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/src/assets/Include/Picture/WebLogo.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/src/output.css">
    <title>Login - Beanesia</title>
</head>
<body class="bg-[#362214] min-h-screen flex overflow-hidden">

    <div class="flex flex-col justify-center w-full max-w-lg px-10 lg:px-16">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-white mb-1">
                Selamat datang kembali
            </h1>
            <p class="text-lg text-gray-300 font-serif">
                Silahkan login untuk membeli
            </p>
        </div>

        <form class="space-y-4" onsubmit="event.preventDefault(); login();">
            <div>
                <label class="block text-xs font-semibold text-white mb-1.5 uppercase tracking-wider">
                    Email
                </label>
                <input
                    id="email"
                    type="email"
                    placeholder="Example@gmail.com"
                    required
                    class="w-full px-3 py-2 text-sm rounded bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#C4A46C]"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold text-white mb-1.5 uppercase tracking-wider">
                    Password
                </label>
                <div class="relative">
                    <input
                        id="password"
                        type="password"
                        required
                        class="w-full px-3 py-2 text-sm rounded bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#C4A46C]"
                    >
                    <button
                        type="button"
                        onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="text-right">
                <a href="#" class="text-xs font-semibold text-white hover:underline">
                    Forgot your password?
                </a>
            </div>

            <button
                onclick="login()"
                type="submit"
                class="w-full bg-[#C4A46C] text-white font-bold py-2.5 rounded text-sm hover:bg-[#b3935b] transition-all tracking-widest"
            >
                LOGIN
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-500/50"></div>
            </div>
            <div class="relative flex justify-center text-[10px] uppercase">
                <span class="bg-[#362214] px-3 text-white font-bold text-center leading-tight">
                    Or <br> with
                </span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button class="flex items-center justify-center py-2 bg-white rounded hover:bg-gray-100 transition-colors">
                <img src="" alt="" class="h-4 w-4">
            </button>
            <button class="flex items-center justify-center py-2 bg-white rounded hover:bg-gray-100 transition-colors">
                <img src="" alt="" class="h-4 w-4">
            </button>
        </div>

        <p class="mt-8 text-center text-xs text-white">
            Tidak Punya Akun? 
            <a href="#" class="font-bold hover:underline">Register</a>
        </p>
    </div>

    <div class="hidden lg:block flex-1 relative">
        <img
            src="/src/assets/Include/Picture/LoginBanner.svg"
            alt="Login - Page.svg"
            class="absolute inset-0 w-full h-full object-cover"
        >
    </div>

    <script src="/src/dist/Log/auth.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
